; GLR-WorkTimer - LilyGo T-Display S3 (ESP32-S3)
; Display: ST7789 320x170, parallel 8-bit interface
[platformio]
default_envs = lilygo-t-display-s3
; Build fuori da Google Drive: il sync su G:\ corrompe i file .o durante l'archiviazione
workspace_dir = C:/pio-ws/GLR-WorkTimer

[env:lilygo-t-display-s3]
platform = espressif32
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; USB-JTAG nativo ESP32-S3: il reset automatico (default) entra in bootloader.
; NON usare --before=no_reset (con app in esecuzione non sincronizza).
upload_port = COM16

; USB CDC on boot so Serial works over the native USB-C port
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=1
	; ---- TFT_eSPI config for T-Display S3 (8-bit parallel) ----
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DINIT_SEQUENCE_3=1
	-DCGRAM_OFFSET=1
	-DTFT_RGB_ORDER=TFT_RGB
	-DTFT_WIDTH=170
	-DTFT_HEIGHT=320
	-DTFT_PARALLEL_8_BIT=1
	-DTFT_DC=7
	-DTFT_RST=5
	-DTFT_WR=8
	-DTFT_RD=9
	-DTFT_BL=38
	-DTFT_D0=39
	-DTFT_D1=40
	-DTFT_D2=41
	-DTFT_D3=42
	-DTFT_D4=45
	-DTFT_D5=46
	-DTFT_D6=47
	-DTFT_D7=48
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_FONT6=1
	-DLOAD_FONT7=1
	-DLOAD_FONT8=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1

lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	tzapu/WiFiManager@^2.0.17

board_build.partitions = default.csv
board_build.filesystem = littlefs
